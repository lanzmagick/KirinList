name: KirinList Test Release

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/test-release.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kirinlist-test-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          java-version: 17
          distribution: temurin

      - name: Test progress colors and build universal FOSS APK
        run: |
          chmod +x gradlew
          sed -i -e '/isEnable = true/s/true/false/' app/build.gradle.kts
          ./gradlew :core:ui:testDebugUnitTest --tests 'com.axiel7.anihyou.core.ui.composables.media.KirinProgressColorsTest' :app:assembleFossDebug --no-daemon

      - name: Prepare test release
        id: release
        run: |
          VERSION=$(sed -n 's/^name *= *//p' version.properties | tr -d '\r')
          SHORT_SHA=${GITHUB_SHA:0:7}
          TAG="test-${VERSION}-${SHORT_SHA}"
          APK_NAME="KirinList-${VERSION}-test-${SHORT_SHA}.apk"
          shopt -s nullglob
          APK_FILES=(app/build/outputs/apk/foss/debug/*.apk)
          if [ "${#APK_FILES[@]}" -ne 1 ]; then
            echo "Expected one universal APK, found ${#APK_FILES[@]}"
            exit 1
          fi
          mkdir -p release-apk
          cp "${APK_FILES[0]}" "release-apk/${APK_NAME}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Publish test pre-release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: KirinList ${{ steps.release.outputs.version }} - RGB Controls Test
          prerelease: true
          fail_on_unmatched_files: true
          files: release-apk/*.apk
          body: |
            KirinList UI preview build, including:
            - Three independent Settings switches for progress colors, FAB RGB fill and FAB RGB border.
            - Tap the Anime/Manga list FAB to shift its border RGB colors.
            - Fix the rectangular inner background on the All list button by drawing one rounded FAB surface.
            - Multi-color chapter, volume and episode stages in Standard, Compact, Grid and Minimal list styles.
            - Count-based color stages for entries whose total episodes/chapters are unknown; zero progress remains unchanged.
            - Realtime airing countdown with the existing episodes-behind logic preserved.
            - New-notification bell shake, pulse dot, and persistent dismissal across app relaunches.
            - Lightweight glossy-glass reflections across image thumbnails.

            Universal FOSS debug APK for testing on Android 7.0 and newer.

            Source commit: ${{ github.sha }}
