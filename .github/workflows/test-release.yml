
name: KirinList Manual APK Release

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: kirinlist-manual-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin

      - name: Build Universal FOSS APK
        run: |
          chmod +x gradlew

          sed -i -e '/isEnable = true/s/true/false/' app/build.gradle.kts

          ./gradlew :app:assembleFossDebug --no-daemon

      - name: Prepare APK
        id: apk
        run: |
          VERSION=$(sed -n 's/^name *= *//p' version.properties | tr -d '\r')
          SHORT_SHA=${GITHUB_SHA:0:7}

          mkdir -p release-apk

          APK_FILES=(app/build/outputs/apk/foss/debug/*.apk)

          if [ "${#APK_FILES[@]}" -ne 1 ]; then
            echo "Expected one universal APK, found ${#APK_FILES[@]}"
            exit 1
          fi

          APK_NAME="KirinList-${VERSION}-${SHORT_SHA}.apk"

          cp "${APK_FILES[0]}" "release-apk/${APK_NAME}"

          echo "name=${APK_NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: manual-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: KirinList APK
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          files: release-apk/*.apk
          body: |
            KirinList Manual Build

            Version: ${{ steps.apk.outputs.version }}

            Universal FOSS Debug APK.
            Built from commit: ${{ github.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
